  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#080a0f] text-slate-100 p-3 md:p-6 min-h-screen">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header de la Herramienta -->
    <div class="border-b border-slate-800/80 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-amber-400 text-xl">🐉</span>
          <h1 class="text-xl md:text-2xl font-bold font-cinzel text-amber-300 tracking-wide">Laboratorio de Statblocks Completos</h1>
        </div>
        <p class="text-slate-400 text-xs md:text-sm mt-0.5">
          Todas las propuestas de diseño mostradas para comparar cuál resuelve mejor la lectura en combate.
        </p>
      </div>

      <!-- Selector de Monstruo -->
      <div class="flex items-center gap-1.5 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 text-xs shadow-inner">
        <span class="text-slate-400 font-semibold px-2 text-[11px] uppercase tracking-wider">Criatura:</span>
        <button id="btn-croc" onclick="selectCreature('croc')" class="creature-btn px-3 py-1.5 rounded-lg font-semibold transition-all bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm">
          🐊 Giant Crocodile
        </button>
        <button id="btn-kobold" onclick="selectCreature('kobold')" class="creature-btn px-3 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-slate-200">
          🦎 Kobold
        </button>
        <button id="btn-dragon" onclick="selectCreature('dragon')" class="creature-btn px-3 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-slate-200">
          🔥 Ancient Red Dragon (Jefe)
        </button>
        <a href="image-demos.html" class="px-3 py-1.5 rounded-lg font-semibold transition-all bg-gradient-to-r from-amber-500/20 to-rose-500/20 hover:from-amber-500/30 hover:to-rose-500/30 text-amber-300 border border-amber-500/40 shadow-sm flex items-center gap-1.5 ml-1">
          <span>🎨</span> Demo Estilos de Imagen
        </a>
      </div>
    </div>

    <!-- Barra de Selección de Vista -->
    <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider font-mono">Modo de Vista:</span>
        <span class="text-[11px] text-amber-400 font-mono">Selecciona para filtrar o revisa todas abajo</span>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="selectDemo('all')" id="tab-all" class="demo-tab px-3.5 py-1.5 rounded-lg font-bold text-xs transition-all bg-amber-500 text-slate-950 shadow-md">
          🌟 VER TODAS A LA VEZ (Comparativa)
        </button>
        <button onclick="selectDemo(7)" id="tab-7" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-amber-500/40 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all">
          👑 Híbrido 5.5e (Recomendado)
        </button>
        <button onclick="selectDemo(1)" id="tab-1" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all">
          1. Pastillas Tácticas
        </button>
        <button onclick="selectDemo(2)" id="tab-2" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all">
          2. Header HUD
        </button>
        <button onclick="selectDemo(3)" id="tab-3" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all">
          3. 5.5e Clean Typo
        </button>
        <button onclick="selectDemo(4)" id="tab-4" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all">
          4. Tabla Resumen
        </button>
        <button onclick="selectDemo(5)" id="tab-5" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all">
          5. Tarjetas Modulares
        </button>
        <button onclick="selectDemo(6)" id="tab-6" class="demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all">
          6. Desglose Boss
        </button>
      </div>
    </div>

    <!-- Contenedor del Statblock / Comparativa -->
    <div id="statblock-container" class="space-y-10">
      <!-- Inyectado por JavaScript -->
    </div>

  </div>

          },
          {

            saveDC: 24,
            saveStat: "DES",
            avgDamage: 91,
            damageDice: "26d6",

          {
            name: "Detect (Detectar)",
            cost: 1,
            text: "El dragón realiza una prueba de Sabiduría (Percepción)."
          },
          {

            cost: 1,
            text: "El dragón realiza un ataque de coletazo."
          },
          {
            name: "Wing Attack (Ataque con Alas)",
            cost: 2,
            text: "El dragón bate sus alas. Cada criatura a 15 pies debe superar una salvación de Destreza CD 25 o sufrir 17 (2d6 + 10) de daño contundente y caer Derribada (Prone). El dragón puede luego volar hasta la mitad de su velocidad."
          }
        ]
      }
    };

    let activeCreature = 'croc';
    let activeDemo = 'all'; // 'all' muestra todas las opciones
    let demo3Theme = 'official'; // 'official' | 'dark'

    function setDemo3Theme(theme) {
      demo3Theme = theme;
      render();
    }

    function selectCreature(key) {
      activeCreature = key;
      document.querySelectorAll('.creature-btn').forEach(btn => {
        btn.className = 'creature-btn px-3 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-slate-200';
      });
      document.getElementById('btn-' + key).className = 'creature-btn px-3 py-1.5 rounded-lg font-semibold transition-all bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm';
      render();
    }

    function selectDemo(val) {
      activeDemo = val;
      document.querySelectorAll('.demo-tab').forEach(t => {
        t.className = 'demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-all';
      });
      const activeBtn = document.getElementById('tab-' + val);
      if (activeBtn) {
        if (val === 'all') {
          activeBtn.className = 'demo-tab px-3.5 py-1.5 rounded-lg font-bold text-xs transition-all bg-amber-500 text-slate-950 shadow-md';
        } else {
          activeBtn.className = 'demo-tab px-3 py-1.5 rounded-lg font-semibold text-xs border border-amber-400/50 bg-amber-500/20 text-amber-300 shadow-sm';
        }
      }
      render();
    }

    function getMod(val) {
      const m = Math.floor((val - 10) / 2);
      return m >= 0 ? '+' + m : '' + m;
    }

    function renderHeader(c) {
      return `
        <div class="border-b-2 border-amber-500/30 pb-3 mb-4">
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <h2 class="text-2xl md:text-3xl font-extrabold font-cinzel text-amber-300 tracking-wide">${c.name}</h2>
            <div class="flex items-center gap-2">
              <span class="text-xs px-2.5 py-1 rounded bg-amber-500/20 border border-amber-500/30 text-amber-300 font-bold font-mono">
                CR ${c.cr} (${c.xp})
              </span>
              <span class="text-xs px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono">
                PB ${c.pb}
              </span>
            </div>
          </div>
          <div class="text-xs text-slate-400 italic mt-0.5 font-serif">
            ${c.size} ${c.type}${c.typeTags.length ? ' (' + c.typeTags.join(', ') + ')' : ''}, ${c.alignment}
          </div>
        </div>
      `;
    }

    function renderVitals(c) {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 mb-4 text-xs font-mono">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-sky-950/60 border border-sky-700/50 flex items-center justify-center text-sky-400 font-bold text-sm">🛡️</div>
            <div>
              <span class="text-[10px] uppercase text-slate-500 font-bold block">Clase Armadura</span>
              <span class="text-sm font-bold text-slate-100">${c.acText}</span>
            </div>
          </div>
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-rose-950/60 border border-rose-700/50 flex items-center justify-center text-rose-400 font-bold text-sm">❤️</div>
            <div>
              <span class="text-[10px] uppercase text-slate-500 font-bold block">Puntos de Golpe</span>
              <span class="text-sm font-bold text-rose-300">${c.hp} <span class="text-slate-400 font-normal text-xs">(${c.hpFormula})</span></span>
            </div>
          </div>
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-950/60 border border-emerald-700/50 flex items-center justify-center text-emerald-400 font-bold text-sm">⚡</div>
            <div>
              <span class="text-[10px] uppercase text-slate-500 font-bold block">Velocidad / Inic.</span>
              <span class="text-xs font-bold text-slate-200">${c.speed}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderClassicStats(c) {
      const statsList = [
        { id: 'FUE', val: c.stats.str },
        { id: 'DES', val: c.stats.dex },
        { id: 'CON', val: c.stats.con },
        { id: 'INT', val: c.stats.int },
        { id: 'SAB', val: c.stats.wis },
        { id: 'CAR', val: c.stats.cha }
      ];
      return `
        <div class="grid grid-cols-6 gap-1.5 md:gap-2 bg-black/40 p-2.5 rounded-xl border border-slate-800/80 mb-4 text-center">
          ${statsList.map(s => `
            <div class="p-1 rounded bg-slate-900/60 border border-slate-800">
              <span class="text-[10px] font-bold text-amber-400 block">${s.id}</span>
              <span class="text-sm md:text-base font-bold text-slate-100 block">${s.val}</span>
              <span class="text-xs font-mono text-slate-400 font-semibold">${getMod(s.val)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderSecondaryStats(c) {
      return `
        <div class="space-y-1.5 text-xs text-slate-300 border-b border-slate-800/80 pb-3 mb-4 leading-relaxed">
          ${c.skills ? '<div><strong class="text-slate-200">Habilidades:</strong> ' + c.skills + '</div>' : ''}
          ${c.damageImmunities ? '<div><strong class="text-slate-200">Inmunidades a daño:</strong> <span class="text-rose-300 font-medium">' + c.damageImmunities + '</span></div>' : ''}
          <div><strong class="text-slate-200">Sentidos:</strong> ${c.senses}</div>
          <div><strong class="text-slate-200">Idiomas:</strong> ${c.languages}</div>
        </div>
      `;
    }

    function renderTraits(c) {
      if (!c.traits || !c.traits.length) return '';
      return `
        <div class="mb-5 space-y-2">
          <div class="border-b border-slate-800 pb-1">
            <h3 class="text-xs font-cinzel font-bold text-amber-400 uppercase tracking-widest">Rasgos Especiales</h3>
          </div>
          <div class="space-y-2 text-xs text-slate-300 leading-relaxed">
            ${c.traits.map(t => `
              <div class="bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/60">
                <strong class="text-amber-300 italic font-semibold text-sm mr-1">${t.name}.</strong>
                <span>${t.text}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderLegendary(c) {
      if (!c.legendary || !c.legendary.length) return '';
      return `
        <div class="mt-5 pt-3 border-t-2 border-amber-500/30 space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-cinzel font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
              <span>👑 Acciones Legendarias</span>
            </h3>
            <span class="text-[11px] text-amber-300 font-mono">3 / Turno</span>
          </div>
          <p class="text-xs text-slate-400 italic">
            El monstruo puede realizar 3 acciones legendarias al final del turno de otra criatura. Recupera las gastadas al inicio de su turno.
          </p>
          <div class="space-y-2 text-xs">
            ${c.legendary.map(l => `
              <div class="bg-slate-950/50 p-2.5 rounded-lg border border-amber-500/20 flex flex-col md:flex-row md:items-baseline justify-between gap-1">
                <div>
                  <strong class="text-amber-300 italic font-semibold">${l.name}.</strong>
                  <span class="text-slate-300 ml-1">${l.text}</span>
                </div>
                <span class="self-end md:self-auto text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30 font-bold whitespace-nowrap">
                  ${l.cost > 1 ? 'Coste: ' + l.cost + ' Acciones' : '1 Acción'}
                </span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // DEMO 7: HÍBRIDO TÁCTICO 5.5e (RECOMENDADO)
    // ==========================================
    function renderFullDemo7(c) {
      const leftStats = [
        { name: 'STR', val: c.stats.str, save: c.saves.str },
        { name: 'DEX', val: c.stats.dex, save: c.saves.dex },
        { name: 'CON', val: c.stats.con, save: c.saves.con }
      ];
      const rightStats = [
        { name: 'INT', val: c.stats.int, save: c.saves.int },
        { name: 'WIS', val: c.stats.wis, save: c.saves.wis },
        { name: 'CHA', val: c.stats.cha, save: c.saves.cha }
      ];

      return `
        <div class="bg-gradient-to-b from-slate-900 to-[#0b0e17] border-2 border-amber-500/50 rounded-2xl p-5 md:p-7 shadow-2xl relative overflow-hidden">
          <div class="absolute top-0 right-0 bg-amber-500 text-slate-950 font-bold font-mono text-[10px] px-3 py-1 rounded-bl-xl uppercase tracking-wider shadow">
            ⭐ Opción Recomendada
          </div>

          ${renderHeader(c)}
          ${renderVitals(c)}

          <!-- Tabla 5.5e Oficial 3+3 con MOD y SAVE -->
          <div class="bg-slate-950/80 p-3 rounded-xl border border-purple-900/40 mb-4 overflow-x-auto shadow-inner">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-mono uppercase text-purple-400 font-bold tracking-wider">Matriz 5.5e de Atributos & Salvaciones</span>
              <span class="text-[10px] text-slate-400">Columnas moradas = tirada directa</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-mono">
              <table class="w-full text-center">
                <thead>
                  <tr class="text-[10px] text-slate-400 border-b border-slate-800">

                      <span class="font-bold text-slate-100 italic text-sm md:text-base mr-1 font-serif">${a.name}.</span>
                      ${a.saveDC ? `
                        <span class="italic text-slate-400">Saving Throw:</span>
                        <strong class="text-purple-300 font-mono text-sm font-bold bg-purple-950/40 px-1.5 py-0.5 rounded border border-purple-800/40">DC ${a.saveDC} ${a.saveStat}</strong>.
                      ` : `
                        <span class="italic text-slate-400">${a.atkType} Attack Roll:</span>
                        <strong class="text-amber-300 font-mono text-sm font-bold bg-amber-500/20 px-1.5 py-0.5 rounded border border-amber-500/30">+${a.bonus}</strong>,
                        reach ${a.reach}.
                      `}
                      ${a.avgDamage ? `
                        <span class="italic text-slate-400">Hit:</span>
                        <strong class="text-rose-300 font-mono text-xs md:text-sm">${a.avgDamage} (${a.damageDice})</strong> ${a.damageType}.
                      ` : ''}

                }).join('')}
              </div>
            </div>

            ${renderLegendary(c)}
          </div>
        </div>
      `;
    }

    // ==========================================
    // DEMO 4: QUICK COMBAT MATRIX
    // ==========================================
    function renderFullDemo4(c) {
      const attackActions = c.actions.filter(a => a.name !== 'Multiattack');

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-7 shadow-2xl">

          ${renderVitals(c)}
          ${renderClassicStats(c)}
          ${renderSecondaryStats(c)}
          ${renderTraits(c)}

          <div class="space-y-4">
            <div class="border-b-2 border-rose-900/50 pb-1.5 flex items-center justify-between">
              <h3 class="text-rose-500 font-cinzel font-bold text-sm tracking-widest uppercase">Acciones & Matriz de Ataques</h3>
              <span class="text-[10px] text-slate-400 font-mono">Tabla Resumen para Consulta Inmediata</span>

            <div class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-950/90 shadow-md">
              <table class="w-full text-left text-xs font-mono">

                    <th class="p-2.5">Acción</th>
                    <th class="p-2.5 text-center">Tirada / CD</th>
                    <th class="p-2.5 text-center">Alcance</th>

                    <th class="p-2.5">Efecto / Condición</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/50">
                  ${attackActions.map(a => `
                    <tr class="hover:bg-slate-900/40">
                      <td class="p-2.5 font-bold font-sans text-slate-200">${a.name}</td>
                      <td class="p-2.5 text-center">
                        ${a.saveDC ? `
                          <span class="text-purple-300 font-bold bg-purple-950/60 px-2 py-0.5 rounded border border-purple-800/50">CD ${a.saveDC} ${a.saveStat}</span>
                        ` : `
                          <span class="text-amber-300 font-bold bg-amber-500/20 px-2 py-0.5 rounded border border-amber-500/40 text-sm">+${a.bonus}</span>
                        `}
                      </td>
                      <td class="p-2.5 text-center text-slate-400">${a.reach || '—'}</td>
                      <td class="p-2.5 font-bold text-rose-300">${a.avgDamage || '—'} <span class="text-slate-500 font-normal">(${a.damageDice || ''})</span></td>
                      <td class="p-2.5 font-sans text-slate-400 text-[11px]">
                        ${a.effect ? (a.effect.length > 60 ? a.effect.slice(0, 60) + '...' : a.effect) : '—'}

                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div class="space-y-2 mt-3 pt-2 text-xs text-slate-300 border-t border-slate-800/50">

              ${c.actions.map(a => `
                <div class="leading-relaxed bg-black/20 p-2 rounded">
                  <strong class="text-slate-100 italic">${a.name}.</strong>
                  <span class="text-slate-300">${a.text || (a.reach ? 'Alcance ' + a.reach + '. ' : '') + 'Impacto: ' + (a.avgDamage || '') + ' (' + (a.damageDice || '') + ') ' + (a.damageType || '') + '. ' + (a.effect || '')}</span>
                </div>
              `).join('')}
            </div>
          </div>

          ${renderLegendary(c)}
        </div>
      `;
    }

    // ==========================================
    // DEMO 5: INTERACTIVE COMBAT CARDS
    // ==========================================
    function renderFullDemo5(c) {
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-7 shadow-2xl">

          ${renderSecondaryStats(c)}
          ${renderTraits(c)}

              <span class="text-[10px] text-slate-400 font-mono">Diseño en Tarjetas Tácticas</span>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

                if (a.name === 'Multiattack') {

                    <div class="col-span-full bg-slate-950/70 p-3 rounded-xl border border-slate-800 text-xs text-slate-300">
                      <span class="font-bold text-amber-300 uppercase font-cinzel text-xs mr-2">Multiataque:</span>

                }
                return `
                  <div class="bg-gradient-to-b from-slate-950 to-slate-900 p-3.5 rounded-xl border border-slate-800 hover:border-slate-700 transition-all shadow-md flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-800/60">
                        <h4 class="font-bold text-slate-100 font-cinzel text-sm">${a.name}</h4>
                        <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded">${a.atkType || 'Acción'}</span>
                      </div>

                      <div class="grid grid-cols-2 gap-2 mb-2.5">
                        <div class="bg-black/50 p-2 rounded-lg border border-slate-800/80 text-center">
                          <span class="text-[9px] uppercase font-bold text-slate-500 block">Tirada Ataque</span>
                          ${a.saveDC ? `
                            <span class="font-mono font-bold text-sm text-purple-300">CD ${a.saveDC} ${a.saveStat}</span>
                          ` : `
                            <span class="font-mono font-bold text-base text-amber-300">+${a.bonus} to hit</span>

                        <div class="bg-black/50 p-2 rounded-lg border border-slate-800/80 text-center">

                          <span class="font-mono font-bold text-sm text-rose-300">${a.avgDamage || '—'} <span class="text-xs text-slate-400 font-normal">(${a.damageDice || ''})</span></span>

    // ==========================================

    // ==========================================
    function renderFullDemo6(c) {
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-7 shadow-2xl">

          ${renderClassicStats(c)}

          ${renderTraits(c)}

          <div class="space-y-3.5">

            </div>

            <div class="space-y-3">
              ${c.actions.map(a => {
                if (a.name === 'Multiattack') {
                  return `
                    <div class="bg-slate-950/70 p-3 rounded-xl border-l-4 border-amber-400 text-xs text-slate-300">
                      <strong class="text-slate-100 font-bold uppercase text-[11px] block text-amber-300 mb-0.5 font-cinzel">Estrategia de Turno: Multiataque</strong>
                      ${a.text}

                  `;
                }
                const isSave = !!a.saveDC;
                return `
                  <div class="bg-slate-950/60 rounded-xl border border-slate-800/80 p-3.5 space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="font-bold text-slate-100 font-cinzel text-sm">${a.name}</span>
                      <span class="font-mono text-xs ${isSave ? 'text-purple-300 bg-purple-950/60 border border-purple-800/50' : 'text-amber-300 bg-amber-500/20 border border-amber-500/40'} font-bold px-2 py-0.5 rounded">
                        ${isSave ? 'Salvación CD ' + a.saveDC + ' ' + a.saveStat : 'Ataque: +' + a.bonus}
                      </span>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-3 text-xs font-mono text-slate-300 bg-black/40 p-2 rounded-lg border border-slate-800/60">
                      <span>📏 Alcance: <strong class="text-slate-100">${a.reach || '—'}</strong></span>
                      <span>•</span>
                      <span>🩸 Daño: <strong class="text-rose-300">${a.avgDamage || '—'} (${a.damageDice || ''})</strong> ${a.damageType || ''}</span>
                    </div>

                    ${a.effect ? `
                      <div class="text-xs text-slate-300 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800 leading-relaxed">
                        <strong class="text-amber-400">Condición / Efecto:</strong> ${a.effect}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          ${renderLegendary(c)}
        </div>
      `;
    }

    // ==========================================

    // ==========================================
    function render() {
      const c = CREATURES_DATA[activeCreature];
      const container = document.getElementById('statblock-container');

      if (activeDemo === 'all') {
        // RENDERIZA TODAS LAS OPCIONES UNA DEBAJO DE LA OTRA
        container.innerHTML = `
          <!-- OPCIÓN 7: HÍBRIDO RECOMENDADO -->

              </div>

            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <span class="text-rose-400 font-bold font-cinzel text-base">Enfoque 1: Tactical Pill Badges</span>
                <p class="text-xs text-slate-400">Mantiene el layout tradicional del Bestiario pero resalta bonos de ataque, daño y CD en pastillas de color.</p>
              </div>
              <span class="text-xs bg-rose-950 text-rose-300 border border-rose-800 font-mono px-2.5 py-1 rounded">ENFOQUE 1</span>
            </div>
            ${renderFullDemo1(c)}
          </section>

          <!-- OPCIÓN 2: ACTION HEADER HUD -->
          <section id="demo-section-2" class="space-y-2 pt-6 border-t border-slate-800">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <span class="text-sky-400 font-bold font-cinzel text-base">Enfoque 2: Action Header HUD</span>
                <p class="text-xs text-slate-400">Barra superior compacta en cada acción: bono y daño visibles de un vistazo antes de leer el texto.</p>

          <!-- OPCIÓN 4: TABLA RESUMEN -->

              <div>
                <span class="text-yellow-400 font-bold font-cinzel text-base">Enfoque 5: Tarjetas Modulares de Ataque</span>

          <!-- OPCIÓN 6: DESGLOSE TÁCTICO BOSS -->
          <section id="demo-section-6" class="space-y-2 pt-6 border-t border-slate-800">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">

                <span class="text-purple-400 font-bold font-cinzel text-base">Enfoque 6: Desglose Táctico Boss</span>

              <span class="text-xs bg-purple-950 text-purple-300 border border-purple-800 font-mono px-2.5 py-1 rounded">ENFOQUE 6</span>

      } else if (activeDemo === 7) {
        container.innerHTML = renderFullDemo7(c);

        container.innerHTML = renderFullDemo1(c);
